name: ci

# Lint, guardrail tests, and the LLM eval suite in replay mode: recorded model
# replies, real tool execution. No API key, no cost, fully deterministic.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Guardrail and loop tests
        run: pytest -q
      - name: Evals (replay)
        run: python evals/run.py
      - name: Eval report
        if: always()
        run: cat evals/report.md >> "$GITHUB_STEP_SUMMARY"
